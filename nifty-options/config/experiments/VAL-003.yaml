# Pipeline validation - can the gate PROMOTE? Positive control with Rs 10L capital (1% = Rs 10,000)
id: VAL-003
title: Pipeline validation - can the gate PROMOTE? Positive control with Rs 10L capital
  (1% = Rs 10,000)
hypothesis: 'Control: with a planted edge AND enough capital for one lot within 1%
  risk, the full gate should be passable. If it is not, the gate is mis-specified.
  Rs 10L is a test setting, not a recommendation.'
data:
  source: synthetic
  synthetic:
    start: '2023-01-02'
    end: '2025-12-31'
    seed: 7
    edge_strength: 0.04
base_strategy:
  name: orb15
  version: '1'
  signal: orb
  signal_params:
    or_minutes: 15
    require_vwap: true
    momentum_bars: 3
    momentum_min_pct: 0.0
    entry_start: 09:30
    entry_end: '14:00'
  structure:
    kind: debit_spread
    long_offset_steps: 0
    width_points: 100
    min_dte: 1
  exits:
    stop_loss_pct: 0.5
    eod_exit_time: '15:15'
    max_hold_days: 0
  liquidity:
    max_rel_spread: 0.05
    min_premium: 2.0
variants:
  A_long_atm:
    structure:
      kind: long_option
      long_offset_steps: 0
  C_itm50_to_otm100:
    structure:
      kind: debit_spread
      long_offset_steps: -1
      width_points: 150
grid:
  signal_params.momentum_min_pct:
  - 0.0
  - 0.05
  - 0.1
  exits.stop_loss_pct:
  - 0.3
  - 0.5
  - 0.7
split:
- 0.6
- 0.2
- 0.2
walk_forward:
  train_days: 250
  test_days: 63
monte_carlo:
  n_sims: 5000
  block: 5
risk:
  initial_capital: 1000000
